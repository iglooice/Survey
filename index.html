<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Audit Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F3;--sf:#fff;--ink:#16212B;--mu:#5E6E7C;--ln:#D6DDE3;--ac:#0E7C8B;--ok:#2E7D4F;--wn:#C77D0A;--bd:#B3362B;--ul:#8A9AA8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171D;--sf:#18222B;--ink:#E6ECF1;--mu:#8FA0AE;--ln:#2A3743;--ac:#4FC3D3;--ok:#5CC28A;--wn:#E3A445;--bd:#EE7A6E;--ul:#5E7384;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171D;--sf:#18222B;--ink:#E6ECF1;--mu:#8FA0AE;--ln:#2A3743;--ac:#4FC3D3;--ok:#5CC28A;--wn:#E3A445;--bd:#EE7A6E;--ul:#5E7384;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,.num{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{font-size:30px;line-height:1.1;margin:0 0 4px;font-weight:700}
.sub{color:var(--mu)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:600 14px "Source Sans 3",sans-serif;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
button.pri,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.err{background:color-mix(in srgb,var(--bd) 14%,var(--sf));border:1px solid var(--bd);padding:10px 12px;border-radius:6px;margin-bottom:14px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:18px}
.tile{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--ok);border-radius:4px;padding:8px 10px}
.tile.warn{border-left-color:var(--wn)}.tile.bad{border-left-color:var(--bd)}
.tile b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.tile span{color:var(--mu);font-size:13px}
.legend{display:flex;gap:14px;color:var(--mu);font-size:13px;margin:-10px 0 18px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--ln);background:var(--sf);border-radius:8px;margin-bottom:18px}
.kpi{padding:14px 16px;border-right:1px solid var(--ln)}.kpi:last-child{border-right:0}
.kpi .num{font-size:30px;font-weight:700;line-height:1.1}.kpi small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
.row{display:grid;grid-template-columns:118px 1fr 52px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.row .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{background:color-mix(in srgb,var(--ln) 60%,transparent);border-radius:3px;height:16px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:1px 0}
.bar{display:block;height:6px;border-radius:2px;min-width:2px}
.tr.one{height:12px;padding:0}.tr.one .bar{height:100%}
.v{text-align:right;font-variant-numeric:tabular-nums}
.key{color:var(--mu);font-size:13px;margin-top:8px}.key i{display:inline-block;width:10px;height:6px;margin:0 4px 1px 10px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mu);font-weight:600;white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover td{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.scroll{overflow-x:auto}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;font-weight:600;margin-right:3px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.n{background:color-mix(in srgb,var(--ul) 20%,transparent);color:var(--mu)}.chip.b{background:color-mix(in srgb,var(--bd) 18%,transparent);color:var(--bd)}
.det td{background:color-mix(in srgb,var(--ln) 35%,transparent)}
.det dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:0}.det dt{color:var(--mu)}.det dd{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:400 14px "Source Sans 3",sans-serif;padding:7px 9px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:6px;width:100%}
.filters input,.filters select{width:auto}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mu)}
.form .wide{grid-column:1/-1}
.drop{border:2px dashed var(--ln);border-radius:10px;padding:44px 20px;text-align:center;background:var(--sf)}
.drop.on{border-color:var(--ac)}
.drop h2{font-size:24px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.head h2{margin:0}.head input{width:260px;max-width:100%}
header .btns button{display:inline-flex;align-items:center;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-left:6px solid var(--ok);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.toast.bad{border-left-color:var(--bd)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-2px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
button:disabled{opacity:.75;cursor:progress}
.auth{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 60%),radial-gradient(700px 420px at 100% 110%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 60%),var(--bg)}
.auth-card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:32px 28px;box-shadow:0 12px 40px rgba(16,30,45,.12);display:flex;flex-direction:column;gap:14px;text-align:center}
.auth-card .logo{display:block;width:100%;max-width:150px;height:auto;margin:0 auto}
.auth-card h1{font-size:24px;margin:0}
.auth-card .sub{margin:-8px 0 4px}
.auth-card .err{text-align:left;margin:0}
.fld{display:flex;flex-direction:column;gap:5px;text-align:left;font-size:13px;font-weight:600;color:var(--mu)}
.inp{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:0 6px 0 10px;color:var(--mu)}
.inp:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.inp input{border:0;background:none;padding:11px 0;font-size:15px;color:var(--ink);outline:none;flex:1;min-width:0}
.go{width:100%;padding:12px;font-size:15px;display:inline-flex;justify-content:center;align-items:center;margin-top:4px}
.note{margin:0;color:var(--mu);font-size:12.5px}
@media (max-width:420px){.auth-card{padding:26px 18px}}
.graf{position:absolute;inset:0;pointer-events:none;z-index:0}
.spray{position:absolute;border-radius:50%;filter:blur(38px);opacity:.35}
.s1{width:320px;height:320px;left:-80px;top:-60px;background:var(--ac)}
.s2{width:280px;height:280px;right:-60px;bottom:-40px;background:var(--wn);opacity:.25}
.s3{width:220px;height:220px;right:12%;top:-70px;background:var(--bd);opacity:.2}
.tag{position:absolute;font-family:"Permanent Marker","Bricolage Grotesque",cursive;font-size:clamp(34px,6vw,76px);line-height:1;opacity:.5;filter:url(#rough);user-select:none}
.tag::after{content:"";position:absolute;left:28%;top:92%;width:4px;height:26px;border-radius:4px;background:currentColor}
.t1{left:6%;top:12%;color:var(--ac);transform:rotate(-8deg)}
.t2{right:7%;top:16%;color:var(--wn);transform:rotate(6deg)}
.t3{left:4%;bottom:10%;color:var(--bd);transform:rotate(5deg);font-size:clamp(26px,4.5vw,54px)}
.t4{right:6%;bottom:8%;color:var(--ok);transform:rotate(-5deg);font-size:clamp(28px,5vw,60px)}
.t5{left:40%;top:3%;color:var(--ac);transform:rotate(3deg);font-size:clamp(24px,3.5vw,42px);opacity:.35}
.doodle{position:absolute;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.45;filter:url(#rough)}
.d1{left:20%;bottom:6%;width:92px;color:var(--ac)}
.d2{right:22%;top:8%;width:130px;color:var(--wn)}
@media (max-width:700px){.t3,.t4,.t5,.d2{display:none}.t1{left:4%;top:4%}.t2{right:4%;top:6%}.d1{left:6%;bottom:3%;width:64px}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:18px;overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--mu);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ac)}
.act{display:flex;gap:2px}
.ib{border:0;background:none;padding:6px;border-radius:6px;color:var(--mu);display:inline-flex;line-height:0}
.ib:hover{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac)}
.ib.d:hover{background:color-mix(in srgb,var(--bd) 14%,transparent);color:var(--bd)}
summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const {useState,useMemo,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
// Column order of the Annex A sheet (A..AL)
const COLS=['zone','date','area','tehsil','district','lat','lng','mp','mpMin','pocName','pocNo','dept','desig','locName','locContact','cmo','siteId','tech','sLat','sLng','cPoc','cPocDesig','cPocNo','calls','ok','fail','voiceRemarks','tests','dl','ul','commercial','gen','solar','backup','health','loadShed','admin','remarks'];
const NUMS=['calls','ok','fail','tests','dl','ul','backup','loadShed'];
const yn=v=>/^y/i.test(String(v||'').trim());
const f1=n=>(+n||0).toFixed(1);
const adminIssue=r=>!/^(n\/?a|-|)$/i.test(String(r.admin||'').trim());
const st=r=>(!yn(r.health)||r.backup===0)?'bad':(adminIssue(r)||r.fail>0)?'warn':'ok';
const fmtDate=v=>{if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);return String(v||'')};
const showDate=s=>{const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
/* ===== PASTE YOUR FIREBASE WEB APP CONFIG HERE ===== */
const CONFIG={
  apiKey: "AIzaSyBBT_bQE4fnfhh1w_w0sHe09Ng5SBnwYwY",
      authDomain: "surv-a75a9.firebaseapp.com",
      projectId: "surv-a75a9",
      appId: "1:87896628452:web:6c92946a4f8465b8b320f1",
};
/* ==================================================== */
let db=null,auth=null;try{if(!CONFIG.apiKey.startsWith('PASTE')){firebase.initializeApp(CONFIG);db=firebase.firestore();auth=firebase.auth()}}catch(e){console.error(e)}
const col=()=>db.collection('sites');
const clean=r=>{const{id,...x}=r;return JSON.parse(JSON.stringify(x))};
async function writeMany(list){const base=Date.now();for(let i=0;i<list.length;i+=400){const b=db.batch();list.slice(i,i+400).forEach((r,j)=>b.set(col().doc(),{...clean(r),createdAt:base+i+j}));await b.commit()}}
async function wipe(){const s=await col().get();for(let i=0;i<s.docs.length;i+=400){const b=db.batch();s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
let uid=0;
const enrich=o=>{const r={...o};NUMS.forEach(k=>{r[k]=parseFloat(r[k])||0});if(!r.fail&&r.calls>r.ok)r.fail=r.calls-r.ok;
  ['siteId','zone','area','district','cmo','tech','mp'].forEach(k=>r[k]=String(r[k]??'').trim());
  r.date=fmtDate(r.date);r.op=r.cmo||'Unknown';r.id=++uid;return r};
function parseBook(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true}).slice(2);
  return rows.filter(r=>String(r[16]).trim()!=='').map(r=>{const o={};COLS.forEach((c,i)=>o[c]=r[i]);return enrich(o)});
}
const FIELDS=[['zone','Zone'],['date','Visit date','date'],['area','Area'],['district','District'],['mp','Parliamentarian'],['cmo','Operator'],['siteId','Site ID'],['tech','Technology'],
 ['calls','Calls made','number'],['ok','Successful calls','number'],['dl','Avg DL (Mbps)','number'],['ul','Avg UL (Mbps)','number'],
 ['commercial','Commercial power','yn'],['gen','Generator','yn'],['solar','Solar','yn'],['backup','Backup (hrs)','number'],['health','Backup health check','yn'],['loadShed','Load shedding (hrs)','number'],
 ['admin','Administrative issues'],['remarks','Recommendations / remarks','area']];

const Ico=({children})=>html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${children}</svg>`;
const Bar=({v,max,c})=>html`<i className="bar" style=${{width:(max?v/max*100:0)+'%',background:c}}></i>`;
const Chip=({y})=>html`<span className=${'chip '+(y?'':'n')}>${y?'Yes':'No'}</span>`;

function App(){
  const [rows,setRows]=useState([]);const [ready,setReady]=useState(false);
  const [err,setErr]=useState('');const [src,setSrc]=useState('');const [drag,setDrag]=useState(false);
  const [fo,setFo]=useState('All'),[fz,setFz]=useState('All'),[q,setQ]=useState(''),[open,setOpen]=useState(null),[add,setAdd]=useState(false);
  const [form,setForm]=useState({});
  const [view,setView]=useState('dash'),[sq,setSq]=useState(''),[editId,setEditId]=useState(null);
  const [saving,setSaving]=useState(false),[toastMsg,setToastMsg]=useState(null);
  const toast=(m,k)=>{setToastMsg({m,k});setTimeout(()=>setToastMsg(null),3500)};
  const fileRef=useRef();
  const guard=async fn=>{if(!db){setErr('Backend is not set up yet.');return false}try{await fn();return true}catch(x){setErr('Could not save to the shared database: '+x.message);return false}};
  const replaceAll=l=>guard(async()=>{await wipe();await writeMany(l)});
  const saveOne=r=>guard(()=>writeMany([r]));
  const removeOne=id=>guard(()=>col().doc(id).delete());
  const updateOne=(id,r)=>guard(()=>col().doc(id).update(clean(r)));
  const startEdit=r=>{const f={};FIELDS.forEach(([k,,t])=>{f[k]=t==='yn'?(r[k]===''||r[k]==null?'':yn(r[k])?'Yes':'No'):(r[k]??'')});setForm(f);setEditId(r.id);setAdd(true);window.scrollTo({top:0,behavior:'smooth'})};
  useEffect(()=>{
    if(!db){setErr('Backend is not set up yet.');setReady(true);return}
    return col().orderBy('createdAt').onSnapshot(s=>{setRows(s.docs.map(d=>({...d.data(),id:d.id})));setReady(true)},
      e=>{setErr('Cannot read the shared database: '+e.message);setReady(true)})},[]);
  

  const load=async f=>{if(!f)return;try{const r=parseBook(await f.arrayBuffer());
    if(!r.length)throw new Error('No site rows found. Use the Annex A layout: two header rows, then one row per site with the Site ID in column Q.');
    if(rows.length&&!confirm('Replace the '+rows.length+' shared records with this file? Everyone will see the change.'))return;setErr('');await replaceAll(r);setSrc(f.name);setFo('All');setFz('All');setQ('')}catch(x){setErr(x.message||'Could not read this file.')}};
  const submit=async()=>{
    if(!String(form.siteId||'').trim()){setErr('Enter a Site ID before saving the record.');return}
    const last=rows[rows.length-1]||{};
    setErr('');
    if(editId){setSaving(true);
      const ok=await updateOne(editId,enrich({...(rows.find(x=>x.id===editId)||{}),...form,fail:0}));
      setSaving(false);
      if(ok){setForm({});setEditId(null);setAdd(false);toast('Changes saved successfully.','ok')}else toast('Could not save changes. Please try again.','bad');
      return}
    await saveOne(enrich({...last,...form,fail:0}));
    setForm({});setAdd(false)};

  const ops=useMemo(()=>['All',...new Set(rows.map(r=>r.op))],[rows]);
  const zones=useMemo(()=>['All',...new Set(rows.map(r=>r.zone))],[rows]);
  const data=useMemo(()=>rows.filter(r=>(fo==='All'||r.op===fo)&&(fz==='All'||r.zone===fz)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q.toLowerCase()))),[rows,fo,fz,q]);
  const S=useMemo(()=>{const n=data.length,sum=f=>data.reduce((a,r)=>a+f(r),0),calls=sum(r=>r.calls);
    return{n,calls,ok:sum(r=>r.ok),dl:n?sum(r=>r.dl)/n:0,ul:n?sum(r=>r.ul)/n:0,health:data.filter(r=>yn(r.health)).length,
      bad:data.filter(r=>st(r)==='bad').length,warn:data.filter(r=>st(r)==='warn').length,
      comm:data.filter(r=>yn(r.commercial)).length,gen:data.filter(r=>yn(r.gen)).length,sol:data.filter(r=>yn(r.solar)).length,
      bk:n?sum(r=>r.backup)/n:0,ls:n?sum(r=>r.loadShed)/n:0}},[data]);
  const byOp=useMemo(()=>{const m={};data.forEach(r=>(m[r.op]=m[r.op]||[]).push(r));
    return Object.entries(m).map(([k,a])=>({k,n:a.length,dl:a.reduce((s,r)=>s+r.dl,0)/a.length,ul:a.reduce((s,r)=>s+r.ul,0)/a.length,h:a.filter(r=>yn(r.health)).length}))},[data]);
  const maxT=Math.max(1,...data.map(r=>Math.max(r.dl,r.ul))),maxB=Math.max(1,...data.map(r=>r.backup));
  const sorted=[...data].sort((a,b)=>b.dl-a.dl);
  const sdata=rows.filter(r=>!sq||Object.values(r).join(' ').toLowerCase().includes(sq.toLowerCase()));
  const dates=[...new Set(rows.map(r=>r.date))].sort();
  const light=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};

  const bar=html`<div className="btns">
    <input ref=${fileRef} type="file" accept=".xlsx,.xls,.csv" hidden onChange=${e=>{load(e.target.files[0]);e.target.value=''}} />
    <button className="pri" onClick=${()=>fileRef.current.click()}><${Ico}><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/><//>Upload file</button>
    <button onClick=${()=>{if(add){setForm({});setEditId(null)}setAdd(!add)}}><${Ico}>${add?html`<path d="M18 6L6 18M6 6l12 12"/>`:html`<path d="M12 5v14M5 12h14"/>`}<//>${add?'Close form':'Add a record'}</button>
    ${rows.length>0&&html`<button onClick=${async()=>{if(confirm('Delete all shared records for everyone?')){await replaceAll([]);setSrc('')}}}><${Ico}><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><//>Clear all</button>`}
    <button onClick=${light}><${Ico}><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor"/><//>Light / dark</button>${auth&&html`<button onClick=${()=>auth.signOut()}><${Ico}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/><//>Sign out</button>`}</div>`;

  return html`<div className="wrap">
    <header><div><h1>Field audit dashboard</h1>
      <div className="sub">Network quality and power backup at surveyed cell sites</div></div>${bar}</header>
    ${err&&html`<div className="err" role="alert">${err}</div>`}
    ${!ready&&html`<p className="sub">Connecting to the shared database…</p>`}
    ${toastMsg&&html`<div className=${'toast '+toastMsg.k} role="status" aria-live="polite">${toastMsg.m}</div>`}

    ${add&&html`<div className="card" style=${{marginBottom:18}}><h2>${editId?'Edit record':'Add a record'}</h2>
      ${!editId&&html`<p className="sub" style=${{marginTop:-6}}>Visit details you leave blank (contacts, coordinates, parliamentarian) are copied from the last record.</p>`}
      <div className="form">${FIELDS.map(([k,l,t])=>html`<label key=${k} className=${t==='area'?'wide':''}>${l}
        ${t==='yn'?html`<select value=${form[k]||''} onChange=${e=>setForm({...form,[k]:e.target.value})}><option value="">Choose</option><option>Yes</option><option>No</option></select>`
        :t==='area'?html`<textarea rows="2" value=${form[k]||''} onChange=${e=>setForm({...form,[k]:e.target.value})}></textarea>`
        :html`<input type=${t||'text'} step="any" value=${form[k]??''} onChange=${e=>setForm({...form,[k]:e.target.value})} />`}</label>`)}</div>
      <div className="btns" style=${{marginTop:12}}><button className="pri" disabled=${saving} onClick=${submit}>${saving&&editId?html`<i className="spin"></i>`:null}${saving&&editId?'Saving…':editId?'Save changes':'Save record'}</button><button onClick=${()=>{setForm({});setEditId(null);setAdd(false)}}>Cancel</button></div></div>`}

    ${!rows.length?html`<div className=${'drop'+(drag?' on':'')} onDragOver=${e=>{e.preventDefault();setDrag(true)}} onDragLeave=${()=>setDrag(false)} onDrop=${e=>{e.preventDefault();setDrag(false);load(e.dataTransfer.files[0])}}>
        <h2>Drop your Annex A spreadsheet here</h2><p className="sub">.xlsx, .xls or .csv with two header rows, then one row per site. Everything is saved to a shared database, so anyone with the link sees the same data. You can also add records by hand with “Add a record”.</p>
        <button className="pri" onClick=${()=>fileRef.current.click()}>Choose a file</button></div>`
    :html`<div>
      <div className="tabs" role="tablist"><button role="tab" aria-selected=${view==='dash'} className=${'tab'+(view==='dash'?' on':'')} onClick=${()=>setView('dash')}>Dashboard</button><button role="tab" aria-selected=${view==='sites'} className=${'tab'+(view==='sites'?' on':'')} onClick=${()=>setView('sites')}>Show all sites (${rows.length})</button></div>
      ${view==='sites'?html`<div className="card"><div className="head"><h2>All sites (${sdata.length})</h2><input type="search" aria-label="Search sites" placeholder="Search sites" value=${sq} onChange=${e=>setSq(e.target.value)} /></div><div className="scroll"><table>
        <thead><tr><th>Site</th><th>Operator</th><th>Tech</th><th>Calls</th><th>DL / UL</th><th>Commercial</th><th>Genset</th><th>Solar</th><th>Backup</th><th>Health</th><th>Actions</th></tr></thead>
        <tbody>${sdata.length?null:html`<tr><td colSpan="11" className="sub">No sites match this search.</td></tr>`}${sdata.map(r=>html`<${React.Fragment} key=${r.id}>
          <tr><td><b>${r.siteId}</b></td><td>${r.op}</td><td>${r.tech}</td><td>${r.ok}/${r.calls}</td><td>${f1(r.dl)} / ${f1(r.ul)}</td>
            <td><${Chip} y=${yn(r.commercial)}/></td><td><${Chip} y=${yn(r.gen)}/></td><td><${Chip} y=${yn(r.solar)}/></td><td>${r.backup} h</td>
            <td>${yn(r.health)?html`<span className="chip">Pass</span>`:html`<span className="chip b">Fail</span>`}</td>
            <td><div className="act">
              <button className="ib" title="View" aria-label=${'View '+r.siteId} onClick=${()=>setOpen(open===r.id?null:r.id)}><${Ico}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><//></button>
              <button className="ib" title="Edit" aria-label=${'Edit '+r.siteId} onClick=${()=>startEdit(r)}><${Ico}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/><//></button>
              <button className="ib d" title="Delete" aria-label=${'Delete '+r.siteId} onClick=${()=>{if(confirm('Delete '+r.siteId+' for everyone?'))removeOne(r.id)}}><${Ico}><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><//></button></div></td></tr>
          ${open===r.id&&html`<tr className="det"><td colSpan="11"><dl>
            <dt>Area</dt><dd>${r.area}, ${r.district}</dd><dt>Parliamentarian</dt><dd>${r.mp}${r.mpMin?' ('+r.mpMin+')':''}</dd>
            <dt>Site contact</dt><dd>${r.cPoc||'—'} ${r.cPocDesig?'('+r.cPocDesig+')':''} ${r.cPocNo}</dd>
            <dt>Administrative issues</dt><dd>${adminIssue(r)?r.admin:'None'}</dd><dt>Recommendation</dt><dd>${r.remarks||'—'}</dd></dl></td></tr>`}
        <//>`)}</tbody></table></div></div>`:html`<div>

      <div className="filters"><select aria-label="Operator" value=${fo} onChange=${e=>setFo(e.target.value)}>${ops.map(o=>html`<option key=${o}>${o}</option>`)}</select>
        <select aria-label="Zone" value=${fz} onChange=${e=>setFz(e.target.value)}>${zones.map(o=>html`<option key=${o}>${o}</option>`)}</select>
        <input placeholder="Search site, area, remarks" value=${q} onChange=${e=>setQ(e.target.value)} /></div>

      <div className="kpis">
        <div className="kpi"><div className="num">${S.n}</div><small>sites audited</small></div>
        <div className="kpi"><div className="num">${S.calls?Math.round(S.ok/S.calls*100):0}%</div><small>voice calls successful (${S.ok}/${S.calls})</small></div>
        <div className="kpi"><div className="num">${f1(S.dl)}</div><small>avg download, Mbps</small></div>
        <div className="kpi"><div className="num">${f1(S.ul)}</div><small>avg upload, Mbps</small></div>
        <div className="kpi"><div className="num">${S.health}/${S.n}</div><small>pass backup health check</small></div>
        <div className="kpi"><div className="num" style=${{color:S.bad?'var(--bd)':'inherit'}}>${S.bad}</div><small>sites with failed or no backup</small></div></div>

      <div className="grid">
        <div className="card"><h2>Throughput by site</h2>
          ${sorted.map(r=>html`<div className="row" key=${r.id}><span className="l">${r.siteId} <span className="sub">${r.op.split('/')[0]}</span></span>
            <span className="tr"><${Bar} v=${r.dl} max=${maxT} c="var(--ac)"/><${Bar} v=${r.ul} max=${maxT} c="var(--ul)"/></span><span className="v">${f1(r.dl)}</span></div>`)}
          <div className="key"><i style=${{background:'var(--ac)'}}></i>Download<i style=${{background:'var(--ul)'}}></i>Upload (Mbps)</div></div>

        <div className="card"><h2>Backup hours per site</h2>
          ${[...data].sort((a,b)=>a.backup-b.backup).map(r=>html`<div className="row" key=${r.id}><span className="l">${r.siteId}</span>
            <span className="tr one"><${Bar} v=${r.backup} max=${maxB} c=${'var(--'+(st(r)==='bad'?'bd':'ok')+')'}/></span><span className="v">${r.backup} h</span></div>`)}
          <div className="key">Average backup ${f1(S.bk)} h against ${f1(S.ls)} h average load shedding.</div></div>

        <div className="card"><h2>Power arrangements</h2>
          ${[['Commercial power',S.comm],['Generator',S.gen],['Solar',S.sol],['Backup health passed',S.health]].map(([l,v])=>html`<div className="row" key=${l}><span className="l">${l}</span>
            <span className="tr one"><${Bar} v=${v} max=${S.n} c="var(--ac)"/></span><span className="v">${v}/${S.n}</span></div>`)}
          <h2 style=${{marginTop:20}}>By operator</h2>
          <div className="scroll"><table><thead><tr><th>Operator</th><th>Sites</th><th>DL</th><th>UL</th><th>Backup ok</th></tr></thead>
          <tbody>${byOp.map(o=>html`<tr key=${o.k}><td>${o.k}</td><td>${o.n}</td><td>${f1(o.dl)}</td><td>${f1(o.ul)}</td><td>${o.h}/${o.n}</td></tr>`)}</tbody></table></div></div>

        </div>
    </div>`}
    </div>`}
  </div>`;
}
function Login(){
  const [em,setEm]=useState(''),[pw,setPw]=useState(''),[busy,setBusy]=useState(false),[show,setShow]=useState(false);
  const [er,setEr]=useState(auth?'':'Backend is not set up yet.');
  const go=async e=>{e.preventDefault();if(!auth)return;setBusy(true);setEr('');
    try{await auth.signInWithEmailAndPassword(em.trim(),pw)}
    catch(x){setEr(x.code==='auth/too-many-requests'?'Too many attempts. Wait a few minutes and try again.':x.code==='auth/network-request-failed'?'Network problem. Check your connection.':'Incorrect email or password.');setBusy(false)}};
  return html`<div className="auth"><div className="graf" aria-hidden="true">
    <svg width="0" height="0" style=${{position:'absolute'}}><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></svg>
    <i className="spray s1"></i><i className="spray s2"></i><i className="spray s3"></i>
    <span className="tag t1">5G</span><span className="tag t2">LTE</span><span className="tag t3">SIGNAL</span><span className="tag t4">AUDIT</span><span className="tag t5">4G</span>
    <svg className="doodle d1" viewBox="0 0 120 160"><path d="M60 32L35 150M60 32L85 150M47 90H73M42 115H78M38 150H82"/><circle cx="60" cy="26" r="4"/><path d="M72 16Q80 26 72 36M80 8Q94 26 80 44M48 16Q40 26 48 36M40 8Q26 26 40 44"/></svg>
    <svg className="doodle d2" viewBox="0 0 160 80"><path d="M5 20C30 5 50 35 80 15S130 30 150 10"/><path d="M20 60l4 10 10 1-8 7 3 10-9-6-9 6 3-10-8-7 10-1z"/></svg>
  </div>
  <form className="auth-card" onSubmit=${go}>
    <img className="logo" src="https://github.com/iglooice/Survey/blob/main/logo.png?raw=true" alt="Dashboard logo" />
    <h1>Field audit dashboard</h1>
    <p className="sub">Sign in</p>
    ${er&&html`<div className="err" role="alert">${er}</div>`}
    <label className="fld">Email<div className="inp"><${Ico}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/><//><input type="email" autoComplete="username" placeholder="you@example.com" required value=${em} onChange=${e=>setEm(e.target.value)} /></div></label>
    <label className="fld">Password<div className="inp"><${Ico}><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/><//><input type=${show?'text':'password'} autoComplete="current-password" placeholder="Enter your password" required value=${pw} onChange=${e=>setPw(e.target.value)} />
      <button type="button" className="ib" aria-label=${show?'Hide password':'Show password'} onClick=${()=>setShow(!show)}><${Ico}>${show?html`<path d="M17.9 17.9A10.9 10.9 0 0112 20C5 20 1 12 1 12a18 18 0 015.1-5.9"/><path d="M9.9 4.2A9.1 9.1 0 0112 4c7 0 11 8 11 8a18 18 0 01-2.2 3.2"/><path d="M1 1l22 22"/>`:html`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>`}<//></button></div></label>
    <button className="pri go" type="submit" disabled=${busy}>${busy?html`<i className="spin"></i>`:null}${busy?'Signing in…':'Sign in'}</button>
    <p className="note">Access is limited to approved accounts.</p></form></div>`;
}
function Root(){
  const [u,setU]=useState(undefined);
  useEffect(()=>{if(!auth){setU(null);return}return auth.onAuthStateChanged(x=>setU(x||null))},[]);
  if(u===undefined)return html`<div className="wrap"><p className="sub">Loading…</p></div>`;
  return u?html`<${App}/>`:html`<${Login}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Root));
</script>
</body>
